name: Verify Polybrutus D13 exact certificate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact symbolic mathematics
        run: python -m pip install sympy==1.14.0
      - name: Verify D13 metric, centered Gram and ideal graph spectrum
        run: python src/verify_d13.py
      - name: Independent exact rational metric and eigenvalue multiplicity checks
        run: python tests/independent_d13.py
